version: 2
updates:
  # Pausado: Dependabot estava abrindo bumps que quebraram deploy/produção.
  # Reative manualmente quando quiser revisar atualizações com calma.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
